<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111315">
  <title>Rev Drive</title>
  <link rel="icon" type="image/svg+xml" href="/src/assets/rev-mark.svg">
  <link rel="stylesheet" href="/src/dashboard.css">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div class="brand">
        <h1>Rev<span> Drive</span></h1>
        <span class="engine-type">Engine playground</span>
      </div>
      <label class="exhaust-control" for="exhaust-tone">Exhaust tone
        <select id="exhaust-tone"><option value="standard">Standard</option><option value="deep">Deeper</option></select>
      </label>
      <span id="status" role="status">Engine off</span>

    </header>

    <section class="cluster" aria-label="Engine instruments">
      <div class="instrument-side">
        <span class="instrument-label" id="gear-label">Gear</span>
        <output id="gear" aria-labelledby="gear-label" aria-live="off">1</output>
        <span class="instrument-caption">Automatic</span>
      </div>
      <div class="dial">
        <div id="tach-track" class="tach-track" role="meter" aria-label="Tachometer" aria-valuemin="0" aria-valuemax="6500" aria-valuenow="850">
          <div class="tach-scale" aria-hidden="true"></div>
          <div class="tach-fill" id="tach-fill"></div>
        </div>
        <div class="dial-face">
          <output id="rpm" aria-labelledby="rpm-label" aria-live="off">850</output>
          <span class="instrument-label" id="rpm-label">RPM</span>
        </div>
      </div>
      <div class="instrument-side">
        <span class="instrument-label" id="speed-label">km/h</span>
        <output id="speed" aria-labelledby="speed-label" aria-live="off">0</output>
        <span class="instrument-caption" id="speed-source">Simulated</span>
      </div>
      <p class="cluster-caption">Acoustic engine <span>·</span> 6-speed automatic</p>
    </section>

    <section class="console" aria-label="Engine controls">
      <nav class="mode-switch" aria-label="Driving mode">
        <button type="button" id="park" aria-pressed="true">Parked test</button>
        <button type="button" id="drive" aria-pressed="false">Phone sensors</button>
      </nav>
      <div class="sliders">
        <div class="control" id="simulation">
          <div class="control-heading">
            <label for="pedal">Test throttle</label>
            <output id="pedal-value" for="pedal" aria-hidden="true">0%</output>
          </div>
          <input id="pedal" type="range" min="0" max="100" value="0">
        </div>
        <div class="control sensor-controls" id="sensors" hidden>
          <p>While parked, mount your phone upright with the screen facing you. Start the engine, allow motion and location access, then zero motion.</p>
          <div class="sensor-actions">
            <button type="button" id="zero">Zero motion</button>
            <label><input id="flip" type="checkbox"> Reverse motion direction</label>
          </div>
          <p id="sensorStatus" role="status"></p>
        </div>
        <div class="control">
          <div class="control-heading">
            <label for="volume">Engine volume</label>
            <output id="volume-value" for="volume" aria-hidden="true">28%</output>
          </div>
          <input id="volume" type="range" min="0" max="100" value="28">
        </div>
      </div>
      <div class="ignition">
        <button type="button" id="power"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10M6.3 5.5a9 9 0 1 0 11.4 0"/></svg><span id="power-label">Start engine</span></button>
      </div>
    </section>
    <footer class="audio-credit"><a href="/vendor/engine-sound-generator/LICENSE" target="_blank" rel="noopener">Acoustic engine license</a></footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
